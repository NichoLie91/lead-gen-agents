[project]
name = "lead-gen-agents"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "dnspython",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001 (blind `except Exception`) is intentionally allowed: the agents
# wrap SDK/integration boundaries (Composio, Gemini, GitHub, Telegram) in
# broad catches so the system degrades to offline/dry-run mode instead of
# crashing mid-pipeline. Keep the catches logged.
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Make `import src` resolve regardless of how pytest is invoked (CI runs plain
# `pytest -q`, where the repo root is not on sys.path by default).
pythonpath = ["."]
