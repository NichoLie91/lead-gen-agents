name: followups

# RETIRED as a sender, manual-only. The Day 3/7/14 cadence was automated off
# the old templated first touch, so there is nothing left for it to send; this
# now only reports what the CRM thinks is due (`followups_due_manual`) and
# sends nothing. No cron, so it cannot burn a daily run on a no-op. Shares the
# pipeline concurrency group so it never collides with an inbound run (they
# all write the same sheets).
on:
  workflow_dispatch:           # manual run via Actions UI or Telegram /run

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  run-followups:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send due follow-ups (mode=followups)
        run: python -m src.pipeline --mode followups
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_FAST: ${{ vars.GEMINI_MODEL_FAST }}
          GEMINI_MODEL_PRO: ${{ vars.GEMINI_MODEL_PRO }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
