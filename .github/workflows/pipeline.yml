name: pipeline

on:
  schedule:
    - cron: "0 15 * * *"       # 15:00 UTC = 22:00 WIB (user's timezone; Actions cron is UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: Which pipeline stage(s) to run
        type: choice
        options:
          - full            # discovery -> enrichment -> scoring -> Pipeline tab (sends nothing)
          - discovery       # Atlas only: candidates -> sheet
          - enrichment      # re-run enrichment for NEEDS_ENRICHMENT / NEEDS_VERIFICATION rows
          - outreach-email  # RETIRED: explains itself, drafts and sends nothing
          - outreach-ig     # RETIRED: explains itself, DMs nothing
          - followups       # RETIRED as a sender: reports what is due, sends nothing
          - inbound         # AI employee loop: scan email for lead replies
          - batch           # research batch: next 10 businesses, drafts only (nothing sent)
          - purge           # one-time: delete the old draft pile, hand over to the batch flow
          - report          # regenerate last-run report + notify via Telegram
        default: full

# Pipeline runs never overlap; a bot-poll CAN and SHOULD run concurrently.
concurrency:
  group: pipeline
  cancel-in-progress: false            # never kill a run in progress

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360               # GitHub max; stages are time-boxed well under this
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Scheduled runs carry NO mode input (inputs.mode == ''), so default to
      # 'full' here — argparse rejects the empty string (exit 2), which is
      # exactly what broke the 2026-08-05 scheduled run.
      - name: Run pipeline (mode=${{ inputs.mode != '' && inputs.mode || 'full' }})
        run: python -m src.pipeline --mode "${{ inputs.mode != '' && inputs.mode || 'full' }}"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}  # direct web-extract fallback for email enrichment
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}  # Hunter.io email finder + verifier
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}  # second key: load-splits LLM calls
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}            # repo variable, default gemini-flash-latest
          GEMINI_MODEL_FAST: ${{ vars.GEMINI_MODEL_FAST }}  # repo variable, default gemini-flash-latest
          GEMINI_MODEL_PRO: ${{ vars.GEMINI_MODEL_PRO }}    # repo variable, default gemini-flash-latest
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          PIPELINE_MAX_WAIT_SEC: "3600"

  # Daily research batch: 10 businesses, one seen problem each, a first-touch
  # email plus day-4 and day-10 closers, posted to Telegram. Drafts only --
  # nothing is sent. Runs after the pipeline and ALWAYS runs: the batch reads
  # the Pipeline tab, so a dead discovery provider can no longer silence the
  # delivery, and the next 10 wait for /next.
  research-batch:
    needs: run-pipeline
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run research batch
        run: python -m src.pipeline --mode batch
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}

# The pipeline script (src/pipeline.py) internally:
#   1. pre-flights Composio connections (sheets + gmail required; ig optional)
#   2. runs the selected stage(s) via the 6 agents
#   3. writes the Google Sheet (Sheets Agent)
#   4. commits NON-PII state (GitHub Agent); checks the /stop flag between stages
#   5. writes state/last_run.json and sends the report / failure alert to Telegram
